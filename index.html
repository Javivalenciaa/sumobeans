    <title>FootballBirthGuesser - Test your knowledge!</title>

    <style>
        :root {
            --primary: #1a4d2e;
            --secondary: #ff9900;
            --background: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: var(--background);
        }

        .welcome-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                url('https://images.unsplash.com/photo-1556056504-5c7696c4c28d') center/cover;
            color: white;
        }

        .logo {
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
        }

        .logo span {
            color: var(--secondary);
        }

        .best-score {
            font-size: 1.5em;
            margin: 20px 0;
        }

        .play-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            background: var(--secondary);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        .game-screen {
            display: none;
            height: 100vh;
        }

        .game-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info {
            text-align: center;
            padding: 10px;
            background: var(--primary);
            color: white;
        }

        #map {
            height: calc(100vh - 280px);
            width: 100%;
        }

        .controls {
            padding: 15px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background: var(--primary);
            color: white;
        }

        .guess-now-btn {
            padding: 10px 30px;
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            margin: 0 5px;
            background: #2ecc71;
        }

        .guess-now-btn:hover {
            background: #27ae60;
        }

        .hint-btn {
            padding: 10px 30px;
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            margin: 0 5px;
            background: #e67e22;
        }

        .hint-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        /* Compatibility fixes */
        body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        .play-btn, .guess-now-btn, .hint-btn {
            -webkit-user-select: none;
            user-select: none;
        }

        /* Added compatibility for mask image */
        .some-element {
            -webkit-mask-image: url(mask.png);
            mask-image: url(mask.png); /* For Firefox support */
        }

        /* Fixed scrollbar properties */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #ff9900;
        }

        /* Fall back for Safari */
        .scroll-container {
            scrollbar-width: thin; /* Firefox */
            scrollbar-gutter: stable;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .buttons-container {
            display: flex;
            gap: 10px;
        }

        .bouncing-ball {
            width: 20px;
            height: 20px;
            position: absolute;
            z-index: 1000;
            animation: bounce 2s cubic-bezier(0.36,0,0.66,1) 1;
            display: none;
        }

        @keyframes bounce {
            0% { transform: translate(-50%, -500px); }
            15% { transform: translate(-50%, 0); }
            30% { transform: translate(-50%, -300px); }
            45% { transform: translate(-50%, 0); }
            60% { transform: translate(-50%, -150px); }
            75% { transform: translate(-50%, 0); }
            85% { transform: translate(-50%, -50px); }
            92% { transform: translate(-50%, 0); }
            100% { transform: translate(-50%, 0); }
        }
    </style>

    function startGame() {
        document.getElementById('welcomeScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('resultScreen').style.display = 'none';
        
        currentRound = 1;
        score = 0;
        usedPlayers = [];
        hintsRemaining = 2;
        updateHintButton();
        initMap();
        startRound();
    }

    function initMap() {
        if (!map) {
            map = L.map('map').setView([0, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            map.on('click', function(e) {
                if (marker) {
                    map.removeLayer(marker);
                }
                marker = L.marker(e.latlng).addTo(map);
            });
        }
    }

    function getRandomPlayer() {
        let availablePlayers = players.filter(p => !usedPlayers.includes(p.name));
        if (availablePlayers.length === 0) {
            usedPlayers = [];
            availablePlayers = players;
        }
        const randomIndex = Math.floor(Math.random() * availablePlayers.length);
        const selectedPlayer = availablePlayers[randomIndex];
        usedPlayers.push(selectedPlayer.name);
        return selectedPlayer;
    }

    function startRound() {
        currentPlayer = getRandomPlayer();
        document.getElementById('playerName').textContent = currentPlayer.name;
        document.getElementById('currentRound').textContent = currentRound;
        document.getElementById('currentScore').textContent = score;
        document.getElementById('timeLeft').textContent = 20;
        document.getElementById('distance').textContent = '';
        
        if (marker) {
            map.removeLayer(marker);
            marker = null;
        }
        
        startTimer();
    }

    function startTimer() {
        let timeLeft = 20;
        clearInterval(timer);
        
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timeLeft').textContent = timeLeft;
            
            if (timeLeft <= 0) {
                makeGuess();
            }
        }, 1000);
    }

    function calculateDistance(guess, actual) {
        const R = 6371; // Earth radius in km
        const lat1 = guess.lat * Math.PI / 180;
        const lat2 = actual[0] * Math.PI / 180;
        const deltaLat = (actual[0] - guess.lat) * Math.PI / 180;
        const deltaLon = (actual[1] - guess.lng) * Math.PI / 180;

        const a = Math.sin(deltaLat/2) * Math.sin(deltaLat/2) +
                Math.cos(lat1) * Math.cos(lat2) *
                Math.sin(deltaLon/2) * Math.sin(deltaLon/2);
        
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function makeGuess() {
        clearInterval(timer);
        
        if (!marker) {
            const popup = L.popup()
                .setLatLng(currentPlayer.birthplace)
                .setContent(`<div class="custom-popup no-guess">No guess made!<br>You get 0 points.</div>`)
                .openOn(map);
            
            const actualMarker = L.marker(currentPlayer.birthplace, {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41]
                })
            }).addTo(map);
            
            map.flyTo(currentPlayer.birthplace, 6, {
                duration: 1.5
            });
            
            setTimeout(() => {
                map.removeLayer(actualMarker);
                map.closePopup(popup);
                map.setView([0, 0], 2);
                
                if (currentRound >= 10) {
                    endGame();
                } else {
                    currentRound++;
                    startRound();
                }
            }, 3000);
            return;
        }
        
        const distance = calculateDistance(marker.getLatLng(), currentPlayer.birthplace);
        let points;

        if (distance <= 30) {
            points = 5000;
        } else if (distance <= 300) {
            points = Math.floor(4999 - ((distance - 31) * (799 / 269)));
        } else if (distance <= 500) {
            points = Math.floor(4200 - ((distance - 301) * (300 / 199)));
        } else if (distance <= 1000) {
            points = Math.floor(3900 - ((distance - 501) * (900 / 499)));
        } else if (distance <= 2000) {
            points = Math.floor(3000 - ((distance - 1001) * (1000 / 999)));
        } else if (distance <= 5000) {
            points = Math.floor(2000 - ((distance - 2001) * (1500 / 2999)));
        } else if (distance <= 9000) {
            points = Math.floor(500 - ((distance - 5001) * (480 / 3999)));
        } else {
            points = Math.max(0, Math.floor(20 - ((distance - 9000) * (20 / 1000))));
        }
        
        score += points;
        
        const actualMarker = L.marker(currentPlayer.birthplace, {
            icon: L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41]
            })
        }).addTo(map);
        
        const line = L.polyline([marker.getLatLng(), currentPlayer.birthplace], {
            color: 'red',
            dashArray: '5, 10'
        }).addTo(map);
        
        const popup = L.popup()
            .setLatLng(currentPlayer.birthplace)
            .setContent(`<div class="custom-popup">Your guess was ${Math.round(distance)} km away from ${currentPlayer.birthplace_city}.<br>You got ${points} points!</div>`)
            .openOn(map);
        
        map.flyTo(currentPlayer.birthplace, 6, {
            duration: 1.5
        });
        
        setTimeout(() => {
            map.removeLayer(actualMarker);
            map.removeLayer(line);
            map.closePopup(popup);
            map.setView([0, 0], 2);
            
            if (currentRound >= 10) {
                endGame();
            } else {
                currentRound++;
                startRound();
            }
        }, 3000);
    }

    function endGame() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('highScore', highScore);
            document.getElementById('highScore').textContent = highScore;
        }
        
        document.getElementById('finalScore').textContent = score;
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'flex';
        
        setTimeout(() => {
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('welcomeScreen').style.display = 'flex';
        }, 2000);
    }

    function updateHintButton() {
        const hintBtn = document.getElementById('hintBtn');
        hintBtn.textContent = `USE HINT (${hintsRemaining})`;
        hintBtn.disabled = hintsRemaining <= 0;
    }

    function getRandomHint() {
        const hintTypes = ['team', 'continent', 'alphabet', 'ball'];
        return hintTypes[Math.floor(Math.random() * hintTypes.length)];

        }).addTo(map);
        
       ball.style.left = ${map.latLngToContainerPoint(landingPoint).x}px;
ball.style.top = ${map.latLngToContainerPoint(landingPoint).y}px;

        ball.style.display = 'block';
        ball.style.animation = 'none';
        void ball.offsetWidth;
        ball.style.animation = 'bounce 2s cubic-bezier(0.36,0,0.66,1) 1';
        
        setTimeout(() => {
            ball.style.display = 'none';
            setTimeout(() => map.removeLayer(circle), 3000);
        }, 2000);
    }

    function showHint() {
        if (hintsRemaining <= 0) return;
        
        const hintType = getRandomHint();
        if (hintType === 'ball') {
            showBallHint();
        } else {
            const hintWheel = document.getElementById('hintWheel');
            const hintResult = document.getElementById('hintResult');
            
            hintWheel.style.display = 'block';
            
            setTimeout(() => {
                hintResult.textContent = `${hintType.toUpperCase()}: ${currentPlayer[hintType]}`;
            }, 1000);
        }
        
        hintsRemaining--;
        updateHintButton();
    }
});
</script>

</body></html>
