/* Plataformas: rectángulos (opcionalmente girados en Y con rot y volteados con roll), círculos (r) y rampas (sl).
   El primer deck que contiene el punto manda, así que los niveles altos van primero en la lista. */
function floorAt(x,z,m){m=m||0;for(let i=0;i<decks.length;i++){const d=decks[i];if(d.off)continue;
 if(d.r){if(Math.hypot(x-d.x,z-d.z)<=d.r-m)return i;continue}
 let lx=x-d.x,lz=z-d.z;if(d.rot!==undefined){const u=lx*d.rc+lz*d.rs;lz=lz*d.rc-lx*d.rs;lx=u}
 if(Math.abs(lx)<=d.w*.5-m&&Math.abs(lz)<=(d.roll?d.d*.5*Math.abs(Math.cos(d.roll)):d.d*.5)-m)return i}return -1}
function deckH(d,x,z){if(!d)return 0;const S=d.sl;if(!S)return d.h||0;const c=S.ax==='x'?x:z;return S.h0+(S.h1-S.h0)*clamp((c-S.a0)/(S.a1-S.a0),0,1)}

  for(const b of balls){b.x+=b.vx*dt;b.z+=b.vz*dt;b.m.position.set(b.x,b.r,b.z);b.m.rotation.z-=b.vx*dt/b.r;b.m.rotation.x+=b.vz*dt/b.r}
  balls=balls.filter(b=>{const ok=Math.abs(b.x)<34&&Math.abs(b.z)<34;if(!ok)stageG.remove(b.m);return ok});
 }finally{NET.mute=false}
}
function netClientTick(){
 const MV=TUNE.move;
 t+=dt;msgT-=dt;shake*=Math.pow(.02,dt);flash=Math.max(0,flash-dt*2.5);if(over)overT+=dt;
 netClientStage();
 const k=1-Math.exp(-dt*22);
 for(const p of players){
  if(p.tx===undefined)continue;
  if(Math.hypot(p.tx-p.x,p.ty-p.y)>160){p.x=p.tx;p.y=p.ty}else{p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k}
  p.tx+=p.vx*dt;p.ty+=p.vy*dt;
  p.face+=wrapA(p.tface-p.face)*k;
  p.jumpH+=(p.n_jumpH-p.jumpH)*k;p.squash+=(p.n_squash-p.squash)*k;p.gh=(p.gh||0)+((p.n_gh||0)-(p.gh||0))*k;
  p.wob+=dt*6;p.stT-=dt;if(!p.alive)p.fall+=dt;p.hitF=Math.max(0,p.hitF-dt*4);p.blink-=dt;p.blinkT-=dt;if(p.blink<=0){p.blink=2+Math.random()*3;p.blinkT=.12}
  const cf=Math.cos(p.face),sf=Math.sin(p.face);
  const af=p.acx*cf+p.acy*sf,as=-p.acx*sf+p.acy*cf;
  p.stzv+=(-MV.torsoK*(p.stz-clamp(af*.00035,-.5,.5))-MV.torsoC*p.stzv)*dt;p.stz+=p.stzv*dt;
  p.stxv+=(-MV.torsoK*(p.stx-clamp(-as*.0004,-.45,.45))-MV.torsoC*p.stxv)*dt;p.stx+=p.stxv*dt;
  p.shzv+=(-MV.headK*(p.shz-p.stz*1.2)-MV.headC*p.shzv)*dt;p.shz+=p.shzv*dt;
  p.shxv+=(-MV.headK*(p.shx-p.stx*1.2)-MV.headC*p.shxv)*dt;p.shx+=p.shxv*dt;
  p.sazv+=(-MV.armK*(p.saz-clamp(af*.0007,-1,1))-MV.armC*p.sazv)*dt;p.saz+=p.sazv*dt;
  p.tfv+=(MV.torsoK*.6*wrapA(p.face-p.tf)-MV.torsoC*p.tfv)*dt;p.tf+=p.tfv*dt;
  p.hfv+=(MV.headK*.6*wrapA(p.tf-p.hf)-MV.headC*p.hfv)*dt;p.hf+=p.hfv*dt;
  const ik=1/Math.max(dt,.001);
  p.acx+=(clamp((p.vx-p.pvx)*ik,-2500,2500)-p.acx)*Math.min(1,dt*18);p.acy+=(clamp((p.vy-p.pvy)*ik,-2500,2500)-p.acy)*Math.min(1,dt*18);
  p.pvx=p.vx;p.pvy=p.vy;
 }
 let pw=0;for(let i=0;i<parts.length;i++){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;if(!q.ng)q.vh-=10*dt;q.h+=q.vh*dt;const qf=q.f===undefined?.1:q.f;if(q.h<qf&&!q.ng){q.h=qf;q.vh*=-.3}q.l-=dt;if(q.l>0)parts[pw++]=q}parts.length=pw;
 let tw2=0;for(let i=0;i<texts.length;i++){const q=texts[i];q.l-=dt;if(q.l>0)texts[tw2++]=q}texts.length=tw2;
 const h=humanInput(),sig=(h.punch?1:0)+'.'+(h.grab?1:0)+'.'+(h.jump?1:0);
 NET.inT+=dt;
 if(NET.inT>=.033||sig!==NET.lastIn){NET.inT=0;NET.lastIn=sig;toHost({t:'in',mx:q1(h.mx),my:q1(h.my),f:q1(h.fwd),g:q1(h.mag),gr:h.grab?1:0,p:h.punch?1:0,j:h.jump?1:0})}
}

 }else if(NET.screen==='lobby'){

  ctx.font='900 '+(24*u)+'px system-ui';ctx.lineWidth=6;ctx.strokeStyle='#3b1f6b';const ttl=NET.pub?'Partida pública':'Sala: '+NET.code;ctx.strokeText(ttl,cx,y+6*u);ctx.fillStyle='#fff';ctx.fillText(ttl,cx,y+6*u);y+=26*u;

   const me=NET.lobby.find(l=>l.id===NET.id);nameEl.value=(me&&me.name)||myName();
   nameEl.addEventListener('input',()=>{clearTimeout(nameTimer);nameTimer=setTimeout(sendName,350)});nameEl.addEventListener('blur',sendName)}

 }

function loop(now){
 const raw=Math.min(.05,(now-last)/1000);last=now;
 if(NET.on){dt=raw}else if(freeze>0){freeze-=raw;dt=raw*.12}else if(slowT>0){slowT-=raw;dt=raw*TUNE.fx.slowScale}else dt=raw;
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 dbgFrames++;
 if(state==='play'){if(NET.on&&!NET.host)netClientTick();else{update();stageTick();netHostTick()}}
 sync3D();
 renderer.render(scene,camera);
 if(state==='menu')menuUI();else{post();hud();stageHud()}
 if(!window.__ok){window.__ok=1;const l=document.getElementById('load');if(l)l.style.display='none'}
 requestAnimationFrame(loop);
}
