button{font:inherit;color:inherit;cursor:pointer;border:0}

#top .score{flex:1;min-width:0}

#ps{color:var(--mu);font-size:14px;font-weight:600}
#ps b{color:var(--ok)}
.ibtn{width:42px;height:42px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:19px;display:grid;place-items:center;position:relative}
.ibtn:active{transform:scale(.94)}
.dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;animation:pulse 1.2s infinite}
#mine{grid-area:mine;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#hint{position:absolute;left:0;right:0;top:20%;text-align:center;font-weight:700;color:#fff;text-shadow:0 2px 8px #000a;pointer-events:none;animation:pulse 1.4s infinite;font-size:18px}
#side{position:absolute;right:10px;top:56px;display:flex;flex-direction:column;gap:8px;z-index:2}
#actions{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.act{pointer-events:auto;padding:10px 14px;border-radius:14px;font-weight:700;font-size:14px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px #0006}
.act:active{transform:scale(.97)}
.act.hot{background:linear-gradient(#7a3cf0,#5b25c4);border-color:#a77bff}
.act.ad{background:linear-gradient(#ff9d1c,#e0620a);border-color:#ffc27a;color:#2b1200}
.act.glow{animation:glow 1.3s infinite}
.act[disabled]{opacity:.45;pointer-events:none}
#shop{grid-area:shop;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line);z-index:2}
#tabs{display:flex;gap:4px;padding:8px 8px 0}
#tabs button{flex:1;padding:10px 4px;border-radius:12px 12px 0 0;background:#160d27;color:var(--mu);font-weight:700;font-size:13px;position:relative}
#tabs button.on{background:var(--panel2);color:#fff}
#buyq{display:flex;gap:6px;padding:8px;background:var(--panel2)}
#buyq button{flex:1;padding:6px 0;border-radius:8px;background:#160d27;color:var(--mu);font-weight:700;font-size:13px}
#buyq button.on{background:var(--acc);color:#1a0a33}
#list{flex:1;overflow-y:auto;padding:8px;background:var(--panel2);display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain;padding-bottom:max(8px,env(safe-area-inset-bottom))}

.row.can{border-color:#6c4bd0;background:linear-gradient(#2a1d4d,#22173f)}
.row.can .cost{color:var(--ok)}
.row.lock{opacity:.45}
.row:active.can{transform:scale(.985)}
.ico{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:26px;background:linear-gradient(#3b2a66,#2a1c4c);border:1px solid #4d3a80}
.nm{font-weight:800;font-size:15px}
.ds{font-size:12px;color:var(--mu);margin-top:2px}
.ds b{color:#fff}

.big{font-size:32px;font-weight:800;color:var(--gold);margin:8px 0}
.btns{display:flex;gap:8px;flex-direction:column}
.btns button{padding:13px;border-radius:14px;font-weight:800;font-size:15px;background:var(--panel2);border:1px solid var(--line)}
.btns .pri{background:linear-gradient(#7a3cf0,#5b25c4);border-color:#a77bff}
.btns .adb{background:linear-gradient(#ff9d1c,#e0620a);border-color:#ffc27a;color:#2b1200}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.day{padding:8px 0;text-align:center;border-radius:10px;background:#160d27;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--mu)}

#loading{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;font-weight:800;font-size:22px;color:var(--gold)}
@keyframes pulse{50%{opacity:.55;transform:scale(1.04)}}
@keyframes glow{50%{box-shadow:0 0 0 3px #ffc83d55,0 4px 14px #0006}}
@keyframes pop{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1);opacity:1}}

@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

</style>

const has = (id) => S.u.indexOf(id) >= 0;

const mileMult = (n) => { let m = 1; for (const x of MILES) if (n >= x) m *= 2; return m; };

const now = () => Date.now();

function globalMult() {
  return (1 + 0.1 * S.cr) * (1 + 0.03 * S.art.length) * (1 + 0.02 * S.ach.length) * Math.pow(2, cnt('a')) * (boostOn() ? 2 : 1) * (frenzyEnd > now() ? 7 : 1);
}
function genRate(i) { return GENS[i].rate * S.c[i] * mileMult(S.c[i]) * Math.pow(2, cnt('o' + i)); }

function clickVal() {

}

function maxN(i) { const b = GENS[i].base * Math.pow(GROW, S.c[i]); return Math.max(0, Math.floor(Math.log(1 + S.g * (GROW - 1) / b) / Math.log(GROW))); }

}

function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended' && !muted()) AC.resume(); return AC; }
function tone(f, d, type, vol, slide) {

  const o = a.createOscillator(), g = a.createGain(), n = a.currentTime;
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, n); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), n + d);
  g.gain.setValueAtTime(vol || .08, n); g.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(g); g.connect(a.destination); o.start(n); o.stop(n + d + .02);

/* ============================== shop UI ============================== */
const TABS = ['miners', 'upg', 'crys'];

function visibleUpgs() {

    if (has(u.id) || seen[u.line]) continue; seen[u.line] = 1;
    if (u.need && S.c[u.need[0]] < u.need[1]) continue;

}
function buildUpgs() {

    m.querySelector('#m1').onclick = () => { earn(val); S.gift = now() + 180000; closeModal(); sfx.gem(); burst(W * .5, H * .5, 30, '#ffd76b'); refreshTop(); save(); };
    m.querySelector('#m2').onclick = () => showAd('rewarded', () => { earn(val * 3); S.gift = now() + 180000; closeModal(); sfx.gem(); burst(W * .5, H * .5, 50, '#ffd76b'); refreshTop(); save(); });
  });
}
function onAscend() {
  const g = crysGain(); if (g < 1) { toast(t('ascendNeed')); return; }
  openModal('<h2>🔮 ' + t('ascTitle') + '</h2><p>' + t('ascTxt') + '</p><div class="big">' + t('gain') + ' +' + g + ' 💎</div><div class="btns"><button class="pri" id="m1">' + t('ascGo') + '</button><button id="m2">' + t('cancel') + '</button></div>', (m) => {
    m.querySelector('#m2').onclick = closeModal;
    m.querySelector('#m1').onclick = () => { closeModal(); const go = () => doAscend(g); if (now() - CG.lastAd > 150000) showAd('midgame', go); else go(); };
  });
}
function doAscend(g) {

  recalc(); checkAch(); buildList(); refreshTop(); sfx.asc(); happy(); burst(W * .5, H * .5, 80, '#c06bff'); toast(t('ascended', g), 'gold'); tab = 'crys'; buildList(); paintTabs(); save();
}

/* ============================== daily & achievements ============================== */
const todayStr = () => new Date().toISOString().slice(0, 10);
const dailyReady = () => S.dayDate !== todayStr();
function dailyVal(day) { return Math.max(500, PS * 600) * (1 + day * 0.5); }
function openDaily() {
  const ready = dailyReady(); const prevStreak = (() => { const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10); return S.dayDate === y ? S.dayN : (S.dayDate === todayStr() ? S.dayN : 0); })();
  const day = ready ? (prevStreak % 7) + 1 : ((S.dayN - 1) % 7) + 1; const val = dailyVal(day);

  openModal('<h2>📅 ' + t('daily') + '</h2><div class="days">' + days + '</div>' + (ready ? '<div class="big">+' + fmt(val) + ' 🪙' + (day === 7 ? ' +3 💎' : '') + '</div><div class="btns"><button class="pri" id="m1">' + t('claim') + '</button><button class="adb" id="m2">' + t('claimAd') + '</button></div>' : '<div class="btns"><button id="m3">' + t('close') + '</button></div>'), (m) => {
    const claim = (mult) => { earn(val * mult); if (day === 7) S.cr += 3 * mult; S.dayN = day; S.dayDate = todayStr(); closeModal(); sfx.gem(); happy(); refreshTop(); save(); };
    const a = m.querySelector('#m1'); if (a) { a.onclick = () => claim(1); m.querySelector('#m2').onclick = () => showAd('rewarded', () => claim(2)); }
    const c = m.querySelector('#m3'); if (c) c.onclick = closeModal;
  });
}
function achVal(k) { return k === 'taps' ? S.taps : k === 'tot' ? S.tot : k === 'gens' ? S.c.reduce((a, b) => a + b, 0) : k === 'asc' ? S.asc : S.gold; }
function checkAch() {
  for (const a of ACHS) if (S.ach.indexOf(a.id) < 0 && achVal(a.k) >= a.v) { S.ach.push(a.id); toast('🏆 ' + a.n[LANG === 'es' ? 1 : 0] + '  (+2%)', 'gold'); sfx.ach(); happy(); recalc(); }
}
function openAch() {
  const rows = ACHS.map((a) => '<div class="row ' + (S.ach.indexOf(a.id) >= 0 ? 'can' : 'lock') + '" style="grid-template-columns:36px 1fr auto;margin-bottom:6px"><div class="ico" style="width:36px;height:36px;font-size:18px">' + (S.ach.indexOf(a.id) >= 0 ? '🏆' : '🔒') + '</div><div><div class="nm">' + a.n[LANG === 'es' ? 1 : 0] + '</div><div class="ds">' + fmt(Math.min(achVal(a.k), a.v)) + ' / ' + fmt(a.v) + '</div></div><div class="cost">+2%</div></div>').join('');
  openModal('<h2>🏆 ' + t('ach') + ' (' + S.ach.length + '/' + ACHS.length + ')</h2>' + rows + '<div class="btns"><button id="m3">' + t('close') + '</button></div>', (m) => { m.querySelector('#m3').onclick = closeModal; });
}

/* ============================== canvas / fx ============================== */
const cv = $('#cv'), cx = cv.getContext('2d'); let W = 300, H = 300, DPR = 1, cxm = 150, cym = 150, R = 100;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); const r = cv.getBoundingClientRect(); W = Math.max(100, r.width); H = Math.max(100, r.height);
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); cxm = W / 2; cym = H * 0.46; R = Math.min(W * 0.34, H * 0.34);
  dust.length = 0; for (let i = 0; i < 40; i++) dust.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .4, v: Math.random() * 6 + 2, a: Math.random() * .5 + .1 });
}
const dust = [], parts = [], floats = []; let squash = 0, shk = 0, pulse = 0;
function shake(n) { shk = Math.max(shk, n); }
function burst(x, y, n, col) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = 80 + Math.random() * 260; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 90, life: .5 + Math.random() * .5, max: 1, c: col || '#ffd76b', s: 2 + Math.random() * 4, g: 600 }); }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}
function floatTxt(x, y, txt, col) { floats.push({ x, y, txt, col: col || '#fff', life: 1 }); if (floats.length > 40) floats.shift(); }
const rockCol = () => isBoss(S.d) ? ['#ff5a4d', '#4a0808'] : GEMCOL[Math.floor((S.d - 1) / 4) % GEMCOL.length];
function drawRock(time) {
  const [c1, c2] = rockCol();
  const sc = (1 - squash * 0.12 + Math.sin(time / 600) * 0.012) * (isBoss(S.d) ? 1.18 : 1); const x = cxm, y = cym + R * 0.1;
  cx.save(); cx.translate(x, y); cx.scale(sc, 1 + squash * 0.1 + (1 - sc)); cx.translate(0, 0);
  const gl = cx.createRadialGradient(0, 0, R * .2, 0, 0, R * 1.7); gl.addColorStop(0, c1 + '77'); gl.addColorStop(1, c1 + '00'); cx.fillStyle = gl; cx.beginPath(); cx.arc(0, 0, R * 1.7, 0, 6.283); cx.fill();
  cx.fillStyle = '#00000055'; cx.beginPath(); cx.ellipse(0, R * .95, R * .95, R * .2, 0, 0, 6.283); cx.fill();
  const spikes = [[-.62, .85, .28, -.45, -.5], [.6, .9, .3, .5, -.35], [-.2, .95, .34, -.1, -1.0], [.25, .95, .3, .2, -.8], [0, .9, .46, 0, -1.2]];
  spikes.forEach((s, k) => {
    const bx = s[0] * R, by = s[1] * R, w = s[2] * R, tx = bx + s[3] * R * .6, ty = by + s[4] * R * 1.5;
    const g = cx.createLinearGradient(bx - w, ty, bx + w, by); g.addColorStop(0, c1); g.addColorStop(1, c2);
    cx.fillStyle = g; cx.beginPath(); cx.moveTo(bx - w, by); cx.lineTo(bx - w * .8, by + (ty - by) * .6); cx.lineTo(tx, ty); cx.lineTo(bx + w * .8, by + (ty - by) * .6); cx.lineTo(bx + w, by); cx.closePath(); cx.fill();
    cx.fillStyle = '#ffffff33'; cx.beginPath(); cx.moveTo(bx - w * .8, by + (ty - by) * .6); cx.lineTo(tx, ty); cx.lineTo(bx - w * .1, by + (ty - by) * .5); cx.closePath(); cx.fill();
    cx.strokeStyle = '#00000044'; cx.lineWidth = 2; cx.stroke();
  });
  const sp = (Math.sin(time / 420) + 1) / 2; cx.fillStyle = '#ffffffcc'; cx.beginPath(); cx.arc(-R * .15, -R * .55, 3 + sp * 3, 0, 6.283); cx.fill();
  cx.restore();
}
let last = performance.now(), saveT = 0, shopT = 0, autoT = 0, goldenT = 0, goldenAt = 0, golden = null;
function frame(tm) {
  const dt = Math.min(0.25, (tm - last) / 1000); last = tm;
  if (!document.hidden) {
    if (PS > 0) { earn(PS * dt); damage(PS * 0.2 * dt); } bossTick();
    squash = Math.max(0, squash - dt * 5); shk = Math.max(0, shk - dt * 14); if (combo > 0 && now() - comboT > 900) combo = 0;
    const au = crysLv('auto'); if (au) { autoT += dt; if (autoT > 1 / au) { autoT = 0; doTap(cxm + (Math.random() - .5) * R, cym + (Math.random() - .5) * R, true); } }
    goldenTick(dt);
    cx.clearRect(0, 0, W, H); cx.save(); if (shk) cx.translate((Math.random() - .5) * shk, (Math.random() - .5) * shk);
    cx.fillStyle = '#ffffff'; dust.forEach((d) => { d.y -= d.v * dt; if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; } cx.globalAlpha = d.a; cx.beginPath(); cx.arc(d.x, d.y, d.r, 0, 6.283); cx.fill(); }); cx.globalAlpha = 1;
    drawRock(tm); drawHud();
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; } p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; cx.globalAlpha = Math.min(1, p.life * 2); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.s, p.s); } cx.globalAlpha = 1;
    cx.font = '800 22px system-ui,sans-serif'; cx.textAlign = 'center'; cx.lineWidth = 4; cx.strokeStyle = '#000a';
    for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.life -= dt * 1.1; if (f.life <= 0) { floats.splice(i, 1); continue; } f.y -= 60 * dt; cx.globalAlpha = Math.min(1, f.life * 1.6); cx.strokeText(f.txt, f.x, f.y); cx.fillStyle = f.col; cx.fillText(f.txt, f.x, f.y); } cx.globalAlpha = 1;
    cx.restore();
    if (golden) drawGolden(tm);
    refreshTopCheap(); shopT += dt; if (shopT > .25) { shopT = 0; refreshShop(); refreshActions(); checkAch(); recalcIfFx(); updateHint(); }
    saveT += dt; if (saveT > 8) { saveT = 0; save(); }
  }
  requestAnimationFrame(frame);
}
function drawHud() {
  const boss = isBoss(S.d), mx = rockMax(S.d), bw = Math.min(W * .72, 440), bx = (W - bw) / 2, by = 34, f = Math.max(0, Math.min(1, S.rhp / mx));
  cx.textAlign = 'center'; cx.lineWidth = 4; cx.strokeStyle = '#000b'; cx.font = '800 16px system-ui,sans-serif'; cx.fillStyle = boss ? '#ff8d8d' : '#fff';
  const label = (boss ? '👑 ' + t('boss') + ' · ' : '⛏️ ') + t('depth') + ' ' + S.d + (boss && bossEnd ? ' · ' + Math.max(0, Math.ceil((bossEnd - now()) / 1000)) + 's' : '');
  cx.strokeText(label, W / 2, by - 8); cx.fillText(label, W / 2, by - 8);
  cx.fillStyle = '#0008'; cx.fillRect(bx - 2, by - 2, bw + 4, 18); cx.fillStyle = boss ? '#ff4d4d' : '#47e0a0'; cx.fillRect(bx, by, bw * f, 14);
  cx.fillStyle = '#fff'; cx.font = '700 11px system-ui,sans-serif'; cx.fillText(fmt(Math.max(0, S.rhp)) + ' / ' + fmt(mx), W / 2, by + 11);
}
let lastGoldTxt = '', lastFx = false;
function refreshTopCheap() { const s = fmt(S.g); if (s !== lastGoldTxt) { lastGoldTxt = s; refreshTop(); } }
function recalcIfFx() { const f = frenzyEnd > now() || boostOn() || furyEnd > now(); if (f !== lastFx) { lastFx = f; recalc(); refreshTop(); } }
function updateHint() {
  const h = $('#hint'); if (S.taps < 8) { h.hidden = false; h.textContent = t('tap'); } else if (S.c[0] === 0 && S.tot > 0) { h.hidden = false; h.textContent = S.g >= 15 ? t('buy') : ''; } else h.hidden = true;
}
/* tapping */
function doTap(x, y, auto) {
  const v = clickVal(); earn(v); S.taps++; quest('taps', 1); damage(v); squash = 1; pulse = 1; combo++; comboT = now(); if (!auto) { sfx.tap(); gameplay(true); } shake(auto ? 0 : 1.5);
  burst(x, y, 6, rockCol()[0]);
  floatTxt(x + (Math.random() - .5) * 30, y - 20, '+' + fmt(v), combo > 8 ? '#ffd76b' : '#fff');
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); const r = cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
  if (golden && Math.hypot(x - golden.x, y - golden.y) < 46) { clickGolden(); return; }
  if (Math.hypot(x - cxm, y - (cym + R * .1)) < R * 1.35 || true) doTap(x, y);
});
window.addEventListener('keydown', (e) => { if (e.code === 'Space' && !e.repeat && modalDepth === 0) { e.preventDefault(); doTap(cxm + (Math.random() - .5) * R * .6, cym); } });
/* golden gem */
function goldenTick(dt) {
  if (golden) { golden.life -= dt; golden.x += golden.vx * dt; golden.y = golden.by + Math.sin(golden.life * 3) * 18; if (golden.life <= 0 || golden.x < -60 || golden.x > W + 60) golden = null; return; }
  goldenT += dt; if (!goldenAt) goldenAt = 40 + Math.random() * 50;
  if (goldenT > goldenAt / (1 + 0.2 * crysLv('gold')) && S.tot > 100) { goldenT = 0; goldenAt = 45 + Math.random() * 60; const dir = Math.random() < .5 ? 1 : -1; golden = { x: dir > 0 ? -30 : W + 30, by: H * (.2 + Math.random() * .5), y: 0, vx: dir * (W / 7), life: 12 }; }
}
function drawGolden(tm) {
  cx.save(); cx.translate(golden.x, golden.y); const s = 1 + Math.sin(tm / 160) * .1; cx.scale(s, s);
  const g = cx.createRadialGradient(0, 0, 4, 0, 0, 44); g.addColorStop(0, '#ffe98a'); g.addColorStop(1, '#ffb30000'); cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, 44, 0, 6.283); cx.fill();
  cx.fillStyle = '#ffc83d'; cx.strokeStyle = '#7a4a00'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(0, -24); cx.lineTo(18, -6); cx.lineTo(11, 20); cx.lineTo(-11, 20); cx.lineTo(-18, -6); cx.closePath(); cx.fill(); cx.stroke();
  cx.fillStyle = '#fff8'; cx.beginPath(); cx.moveTo(0, -24); cx.lineTo(-18, -6); cx.lineTo(-2, -4); cx.closePath(); cx.fill(); cx.restore();
}
function clickGolden() {
  const x = golden.x, y = golden.y; golden = null; S.gold++; sfx.gem(); happy(); burst(x, y, 50, '#ffd76b');
  if (Math.random() < .5) { frenzyEnd = now() + 30000; recalc(); toast('✨ ' + t('golden') + ' ' + t('frenzy'), 'gold'); }
  else { const v = Math.max(300, PS * 900); earn(v); toast('✨ ' + t('lucky', fmt(v)), 'gold'); }
  checkAch(); refreshTop();
}

/* ============================== offline / welcome ============================== */
function offlineCheck() {
  const gone = Math.min((now() - S.last) / 1000, offCap()); if (gone < 90 || PS <= 0) return;
  const val = PS * gone * (0.5 + 0.1 * crysLv('off')); if (val < 1) return;
  openModal('<h2>' + t('welcome') + '</h2><p>' + t('away') + ' (' + fmtT(gone) + ')</p><div class="big">+' + fmt(val) + ' 🪙</div><div class="btns"><button class="pri" id="m1">' + t('collect') + '</button><button class="adb" id="m2">' + t('collect2') + '</button></div>', (m) => {
    m.querySelector('#m1').onclick = () => { earn(val); closeModal(); sfx.gem(); refreshTop(); save(); };
    m.querySelector('#m2').onclick = () => showAd('rewarded', () => { earn(val * 2); closeModal(); sfx.gem(); refreshTop(); save(); });
  });
}

/* ============================== boot ============================== */
function paintMute() { $('#bMute').textContent = muted() && !adOn ? '🔇' : '🔊'; }
async function main() {
  await cgBoot(); load(); newQuests(); recalc(); ensureRock(); resize(); buildTabs(); buildList(); buildActions(); refreshTop(); refreshActions(); paintMute();
  $('#app').hidden = false; resize(); $('#loading').remove();
  try { const k = sdk(); if (k) k.game.loadingStop(); } catch (e) {}
  $('#bMute').onclick = () => { S.mute = !S.mute; paintMute(); toast(t(S.mute ? 'soundOff' : 'soundOn')); if (!S.mute) { actx(); sfx.buy(); } save(); };
  $('#bDaily').onclick = openDaily; $('#bAch').onclick = openAch; $('#bArt').onclick = openColl; $('#bQ').onclick = openQuests;
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); gameplay(false); } else { if (modalDepth === 0 && !adOn && S.taps > 0) gameplay(true); S.last = Math.max(S.last, now() - 1000); } });
  window.addEventListener('pagehide', save); window.addEventListener('beforeunload', save);
  setTimeout(offlineCheck, 400); requestAnimationFrame((t0) => { last = t0; frame(t0); });
  window.__gm = { S: () => S, doTap, buyGen, earn, recalc, openDaily, onAscend, doAscend, crysGain, buildList, get PS() { return PS; } };
}
main();
</script>
