<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Horde</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07040f">

<style>
[hidden]{display:none!important}
:root{--bg:#07040f;--cy:#5ee7ff;--mg:#ff4fd8;--go:#ffc83d;--tx:#f2ecff;--mu:#a99bd0;--pn:#140c27;--ln:#3a2a66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;z-index:10;overflow:auto}
.dim{background:radial-gradient(70% 70% at 50% 45%,#0a051acc,#05020bf0)}
.title{font-family:Impact,"Arial Black","DejaVu Sans",sans-serif;font-weight:900;font-style:italic;text-align:center;line-height:.9;margin:0;font-size:clamp(46px,11vw,120px);letter-spacing:2px;background:linear-gradient(#fff 0%,#8ff1ff 35%,#ff4fd8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ff4fd8aa) drop-shadow(0 4px 0 #2a0a4a)}
.title small{display:block;font-size:.34em;letter-spacing:.5em;margin-top:6px;color:var(--cy);-webkit-text-fill-color:var(--cy);filter:none;text-shadow:0 0 14px var(--cy)}
.btn{padding:14px 26px;border-radius:14px;font-weight:800;font-size:18px;background:#23164a;border:1px solid var(--ln);box-shadow:0 6px 20px #0008;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.play{font-size:clamp(24px,4vw,34px);padding:16px 54px;background:linear-gradient(#ff5fe0,#a31fd0);border:1px solid #ffb3f2;box-shadow:0 0 30px #ff4fd88a,0 8px 24px #000a;animation:beat 1.6s infinite}
.btn.ad{background:linear-gradient(#ffb03a,#e0620a);border-color:#ffd08a;color:#2b1200}
.btn.sm{padding:10px 16px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hero{width:min(30vw,170px);padding:10px 8px;border-radius:16px;background:#150c2b;border:2px solid var(--ln);text-align:center;position:relative}
.hero.on{border-color:var(--cy);box-shadow:0 0 22px #5ee7ff66;background:#1a1040}
.hero canvas{width:84px;height:92px}
.hero b{display:block;font-size:15px}.hero span{display:block;font-size:11px;color:var(--mu);margin-top:2px}
.hero.lock{opacity:.7}.hero .lk{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;background:#07040fb0;border-radius:14px;color:var(--go)}
.stats{color:var(--mu);font-size:14px;text-align:center}
.card{width:min(94vw,640px);background:linear-gradient(#1c1040,#120a28);border:1px solid #5a3fa0;border-radius:20px;padding:18px;box-shadow:0 20px 60px #000b}
.card h2{margin:0 0 8px;text-align:center;font-size:26px}
.ups{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:min(96vw,760px)}
.up{width:min(30%,220px);min-width:140px;flex:1;padding:14px 10px;border-radius:16px;background:linear-gradient(#24165a,#170d38);border:2px solid #5a3fa0;text-align:center;box-shadow:0 8px 24px #000a;animation:rise .25s backwards}
.up:hover{border-color:var(--cy);box-shadow:0 0 24px #5ee7ff66}
.up .ic{font-size:44px;filter:drop-shadow(0 0 10px #5ee7ff)}
.up b{display:block;font-size:17px;margin:4px 0}.up p{margin:4px 0 8px;font-size:13px;color:var(--mu);min-height:34px}
.pips{display:flex;gap:4px;justify-content:center}.pips i{width:12px;height:6px;border-radius:3px;background:#3a2a66}.pips i.on{background:var(--go);box-shadow:0 0 8px var(--go)}
.up kbd{display:inline-block;margin-top:6px;font-size:11px;color:var(--mu);border:1px solid var(--ln);border-radius:5px;padding:0 6px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0;max-height:52vh;overflow:auto}
.si{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#150c2b;border:1px solid var(--ln);text-align:left;width:100%}
.si .ic{font-size:28px}.si b{display:block;font-size:14px}.si span{font-size:11px;color:var(--mu)}.si em{margin-left:auto;font-style:normal;font-weight:800;color:var(--go);font-size:14px;white-space:nowrap}
.si.can{border-color:var(--cy)}
.big{font-size:44px;font-weight:900;color:var(--go);text-shadow:0 0 18px #ffb300aa}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.res div{background:#150c2b;border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}.res b{display:block;font-size:22px}.res span{font-size:12px;color:var(--mu)}
.top{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:6}
.ibtn{width:42px;height:42px;border-radius:12px;background:#140c27cc;border:1px solid var(--ln);font-size:19px;display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#000c;border:1px solid var(--ln);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;animation:tin .25s,tout .4s 2.2s forwards}
#loading{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;font:900 28px Impact,sans-serif;color:var(--mg);letter-spacing:3px}
@keyframes beat{50%{transform:scale(1.045)}}@keyframes rise{from{transform:translateY(24px);opacity:0}}@keyframes tin{from{opacity:0;transform:translateY(8px)}}@keyframes tout{to{opacity:0}}
</style>
</head>
<body>
<div id="loading">NEON HORDE…</div>
<canvas id="cv"></canvas>
<div class="top" id="topbtns" hidden><button class="ibtn" id="bPause" aria-label="Pause">⏸</button><button class="ibtn" id="bSnd" aria-label="Sound">🔊</button></div>
<div id="toast"></div>
<div class="screen" id="sMenu" hidden>
  <h1 class="title">NEON<br>HORDE<small>SURVIVORS</small></h1>
  <div class="row" id="heroes"></div>
  <button class="btn play" id="bPlay"></button>
  <div class="row"><button class="btn sm" id="bShop"></button><button class="btn sm" id="bSnd2"></button></div>
  <div class="stats" id="mstats"></div>
</div>
<div class="screen dim" id="sShop" hidden><div class="card"><h2 id="shopT"></h2><div class="stats" id="shopG"></div><div class="shop" id="shopL"></div><div class="row"><button class="btn" id="bShopX"></button></div></div></div>
<div class="screen dim" id="sUp" hidden><h2 class="title" style="font-size:clamp(28px,6vw,48px)" id="upT"></h2><div class="ups" id="upL"></div><div class="row"><button class="btn sm ad" id="bReroll"></button></div></div>
<div class="screen dim" id="sPause" hidden><div class="card" style="text-align:center"><h2 id="pauseT"></h2><div class="row" style="margin-top:14px"><button class="btn play" style="font-size:22px;padding:14px 36px" id="bResume"></button><button class="btn sm" id="bQuit"></button></div><div class="stats" style="margin-top:12px" id="pauseH"></div></div></div>
<div class="screen dim" id="sOver" hidden><div class="card" style="text-align:center"><h2 id="overT"></h2><div class="res" id="overR"></div><div class="big" id="overG"></div><div class="row" style="margin-top:8px"><button class="btn ad" id="bRevive"></button><button class="btn ad" id="bX2"></button></div><div class="row" style="margin-top:10px"><button class="btn play" style="font-size:22px;padding:14px 36px" id="bAgain"></button><button class="btn sm" id="bMenu"></button></div></div></div>
<script>
'use strict';
