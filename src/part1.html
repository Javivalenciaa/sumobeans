<html lang="en">
<head>
<meta charset="utf-8">
<title>Bumper Orbs</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1f6b">

<style>
[hidden]{display:none!important}
:root{--bg:#241a5e;--go:#ffd23a;--or:#ff8a1a;--tx:#fffaf0;--mu:#c9bff0;--pn:#33267c;--ln:#6a5cc8;--gr:#58e07a;--rd:#ff5a6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none}
button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;z-index:10;overflow:auto}
.dim{background:radial-gradient(70% 70% at 50% 45%,rgba(30,22,80,.78),rgba(18,12,52,.94))}
.title{font-family:Impact,"Arial Black","DejaVu Sans",sans-serif;font-weight:900;text-align:center;line-height:.92;margin:0;font-size:clamp(46px,11vw,112px);letter-spacing:3px;background:linear-gradient(#fffbc0 0%,#ffd23a 40%,#ff8a1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 0 0 #2a1408) drop-shadow(-3px 0 0 #2a1408) drop-shadow(0 3px 0 #2a1408) drop-shadow(0 -3px 0 #2a1408) drop-shadow(0 9px 0 #8a3a0a) drop-shadow(0 14px 10px rgba(0,0,0,.4))}
.title small{display:block;font-size:.26em;letter-spacing:.4em;margin-top:10px;color:#fff;-webkit-text-fill-color:#fff;filter:none;text-shadow:0 3px 0 #2a1408,2px 2px 0 #2a1408,-2px 2px 0 #2a1408}
.btn{padding:12px 24px;border-radius:14px;font-weight:900;font-size:18px;background:linear-gradient(#6a5cc8,#4638a0);border:2px solid #1c1424;border-bottom-width:5px;box-shadow:0 6px 14px rgba(0,0,0,.4);transition:transform .08s,filter .15s;text-shadow:0 2px 0 rgba(0,0,0,.4);min-width:150px}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.play{font-size:clamp(22px,4vw,32px);padding:14px 50px;background:linear-gradient(#8aef6a,#2fae3e);border-color:#14501c;animation:beat 1.6s infinite}
.btn.ad{background:linear-gradient(#ffd86a,#ee8a1a);border-color:#7a3a08;color:#3a1a04;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.sm{padding:8px 14px;font-size:15px;min-width:0;border-bottom-width:4px}
.btn.red{background:linear-gradient(#ff8a8a,#d02a3a);border-color:#5a0a14}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.card{width:min(94vw,560px);background:linear-gradient(#4a3a9a,#2e2370);border:3px solid #7a6cd8;border-radius:20px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.55);text-align:center}
.card h2{margin:0 0 8px;font-size:26px}
.nm{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:12px;padding:6px 10px;font-weight:800}
.nm canvas{width:44px;height:44px}
.code{font:900 54px Impact,"Arial Black",sans-serif;letter-spacing:10px;color:var(--go);text-shadow:0 4px 0 #8a3a0a,2px 2px 0 #2a1408;margin:4px 0}
input.in{background:rgba(0,0,0,.35);border:2px solid var(--ln);border-radius:12px;padding:12px;font:900 30px Impact,sans-serif;letter-spacing:8px;text-align:center;text-transform:uppercase;width:min(80vw,230px);outline:0}
input.in:focus{border-color:var(--go)}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pl{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.26);border-radius:12px;padding:6px 12px;font-weight:800;text-align:left}
.pl canvas{width:38px;height:38px}.pl em{margin-left:auto;font-style:normal;color:var(--mu);font-size:13px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:10px 0;max-height:52vh;overflow:auto;padding:4px}
.sk{background:rgba(0,0,0,.28);border:3px solid transparent;border-radius:14px;padding:8px 4px;font-size:12px;font-weight:800;position:relative}
.sk canvas{width:64px;height:64px;display:block;margin:0 auto 4px}.sk.on{border-color:var(--go);background:rgba(255,210,58,.16)}.sk i{display:block;font-style:normal;color:var(--go);font-size:12px}
.sk.lock canvas{filter:grayscale(.7) brightness(.8)}
.stats{color:var(--mu);font-size:14px;text-align:center}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.res div{background:rgba(0,0,0,.26);border-radius:12px;padding:8px}.res b{display:block;font-size:22px}.res span{font-size:12px;color:var(--mu)}
.big{font-size:40px;font-weight:900;color:var(--go);text-shadow:0 3px 0 #7a3a08,2px 2px 0 #2a1408,-2px 2px 0 #2a1408}
.top{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:6}
.ibtn{width:42px;height:42px;border-radius:12px;background:rgba(36,26,94,.85);border:2px solid var(--ln);font-size:19px;display:grid;place-items:center;color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:rgba(0,0,0,.78);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;animation:tin .25s,tout .4s 2.4s forwards}
#loading{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;font:900 28px Impact,sans-serif;color:var(--go);letter-spacing:3px}
.how{text-align:left;line-height:1.5;font-size:15px}.how b{color:var(--go)}.how kbd{background:rgba(0,0,0,.4);border:1px solid var(--ln);border-radius:6px;padding:1px 7px;font-weight:800}
@keyframes beat{50%{transform:scale(1.045)}}@keyframes tin{from{opacity:0;transform:translateY(8px)}}@keyframes tout{to{opacity:0}}
</style>
</head>
<body>
<div id="loading">BUMPER ORBS…</div>
<canvas id="cv"></canvas>
<div class="top" id="topbtns" hidden><button class="ibtn" id="bPause" aria-label="Pause">⏸</button><button class="ibtn" id="bSnd" aria-label="Sound">🔊</button></div>
<div id="toast"></div>
<div class="screen" id="sMenu" hidden style="background:radial-gradient(60% 75% at 50% 48%,rgba(30,20,80,.55),rgba(30,20,80,0))">
  <h1 class="title">BUMPER<br>ORBS<small>SUMO ARENA</small></h1>
  <div class="row"><div class="nm"><canvas id="meOrb" width="88" height="88"></canvas><span id="meName"></span><button class="btn sm" id="bDice" aria-label="New name">🎲</button></div></div>
  <button class="btn play" id="bSolo"></button>
  <div class="row"><button class="btn" id="bQuick"></button><button class="btn" id="bCreate"></button><button class="btn" id="bJoin"></button></div>
  <div class="row"><button class="btn sm" id="bSkins"></button><button class="btn sm" id="bHow"></button><button class="btn sm" id="bLang"></button><button class="btn sm" id="bSnd2"></button></div>
  <div class="stats" id="mstats"></div>
</div>
<div class="screen dim" id="sJoin" hidden><div class="card"><h2 id="joinT"></h2><input class="in" id="codeIn" maxlength="4" autocomplete="off" spellcheck="false"><div class="row" style="margin-top:12px"><button class="btn play" style="font-size:22px;padding:12px 36px" id="bJoinGo"></button><button class="btn sm" id="bJoinX"></button></div></div></div>
<div class="screen dim" id="sLobby" hidden><div class="card"><h2 id="lobT"></h2><div class="stats" id="lobSub"></div><div class="code" id="lobCode"></div><div class="plist" id="lobList"></div><div class="stats" id="lobMsg"></div><div class="row" style="margin-top:8px"><button class="btn play" style="font-size:22px;padding:12px 36px" id="bStart"></button><button class="btn sm" id="bCopy"></button><button class="btn sm red" id="bLeave"></button></div></div></div>
<div class="screen dim" id="sSkins" hidden><div class="card" style="width:min(96vw,640px)"><h2 id="skT"></h2><div class="stats" id="skCoins"></div><div class="skins" id="skList"></div><div class="row"><button class="btn" id="bSkinsX"></button></div></div></div>
<div class="screen dim" id="sHow" hidden><div class="card"><h2 id="howT"></h2><div class="how" id="howTxt"></div><div class="row" style="margin-top:12px"><button class="btn" id="bHowX"></button></div></div></div>
<div class="screen dim" id="sPause" hidden><div class="card"><h2 id="pauseT"></h2><div class="row"><button class="btn play" style="font-size:22px;padding:12px 36px" id="bResume"></button><button class="btn red sm" id="bQuit"></button><button class="btn sm" id="bLang2"></button></div><div class="stats" id="pauseH" style="margin-top:10px"></div></div></div>
<div class="screen dim" id="sRes" hidden><div class="card"><h2 id="resT"></h2><div class="big" id="resWin"></div><div class="plist" id="resList"></div><div class="big" style="font-size:30px" id="resCoins"></div><div class="row" style="margin-top:8px"><button class="btn ad" id="bX2"></button></div><div class="row" style="margin-top:8px"><button class="btn play" style="font-size:22px;padding:12px 36px" id="bAgain"></button><button class="btn sm" id="bMenu"></button></div></div></div>
<script>
'use strict';
